# A sample job for medalion_analytics.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/medallion_analytics/bronze.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"



