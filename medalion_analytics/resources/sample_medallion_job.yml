
resources:
  jobs:
    sample_job:
      name: medallion_sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}


      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/medallion/bronze.ipynb

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/medallion/silver.ipynb
            

      environments:
        - environment_key: default
          spec:
            environment_version: "4"



