# This is a Databricks asset bundle definition for medalion_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: medalion_analytics
  uuid: 1118bd73-b5ef-4191-a3ec-02352a43ca36

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: "DEV_${workspace.current_user.short_name}_"
    workspace:
      host: https://dbc-aab5aa5a-ee27.cloud.databricks.com
    variables:
      catalog: analytics_dev
      schema: bronze

  prod:
    mode: production
    presets:
      name_prefix: PROD_
    workspace:
      host: https://dbc-aab5aa5a-ee27.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/borge.pambo71@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/borge.pambo71@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: analytics_prod
      schema: bronze
    permissions:
      - user_name: borge.pambo71@gmail.com
        level: CAN_MANAGE
