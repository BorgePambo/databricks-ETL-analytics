# Workflow de CI/CD para produção no Databricks
name: Production Deployment CI/CD

# Evita múltiplos deploys simultâneos
concurrency: 1

# Executa quando houver push na branch main
on:
  push:
    branches:
      - main

    # Executa apenas se houver alterações no projeto
    paths:
      - 'medalion_analytics/**'

jobs:
  deploy:
    name: Bundle Deploy
    runs-on: ubuntu-latest

    steps:
      # Clona o repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # Validação do bundle
      - name: Validate Bundle
        working-directory: medalion_analytics
        run: databricks bundle validate -t prod

        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Deploy do bundle
      - name: Deploy Bundle
        working-directory: medalion_analytics
        run: databricks bundle deploy -t prod

        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
